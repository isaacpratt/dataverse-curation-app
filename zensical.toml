# Zensical configuration for the Dataverse Docent documentation.
# Native Zensical format (not mkdocs.yml compatibility mode) — decision
# dv-l1f, 2026-11-20; information architecture rewritten to Diátaxis in dv-uq6.
# The nav is grouped by quadrant, and every page declares its page_type and
# TGDP template in YAML front matter (checked by tools/tests/test_docs_consistency.py).

[project]
site_name = "Dataverse Docent"
site_description = "Desktop curation assistant for Alliance Dataverse — checks, metadata review, and curation reports."
site_url = "https://isaacpratt.github.io/dataverse-curation-app/"
repo_url = "https://github.com/isaacpratt/dataverse-curation-app"
repo_name = "isaacpratt/dataverse-curation-app"
docs_dir = "docs"
site_dir = "site"
# Historical design records and reports are kept in the repo but not published.
exclude_docs = """
/reports/
/adr/
"""
# Frozen proposal snapshots: built and searchable, but deliberately out of the nav.
not_in_nav = """
/proposals/
"""

# One page, one quadrant. Home, troubleshooting, release notes and the style
# guide are TGDP/governance page types rather than quadrants; they sit after
# the four quadrants so the nav reads as a Diátaxis map.
nav = [
  { "Home" = "index.md" },
  { "Tutorials" = [
      { "Your first review" = "tutorials/first-review.md" },
  ]},
  { "How-to guides" = [
      { "Install the app" = "how-to/install.md" },
      { "Configure an instance" = "how-to/configure-instance.md" },
      { "Run checks on a dataset" = "how-to/run-checks.md" },
      { "Respond and export" = "how-to/respond-and-export.md" },
      { "Run headless" = "how-to/run-headless.md" },
      { "Add a check" = "how-to/add-a-check.md" },
      { "Run the gates" = "how-to/run-the-gates.md" },
      { "Package and release" = "how-to/package-and-release.md" },
  ]},
  { "Reference" = [
      { "Checks" = "reference/checks.md" },
      { "Report contract" = "reference/report-contract.md" },
      { "Configuration" = "reference/configuration.md" },
      { "Dataverse API" = "reference/dataverse-api.md" },
      { "CLI" = "reference/cli.md" },
      { "Entry checks" = "reference/entry-checks.md" },
      { "Project layout" = "reference/project-layout.md" },
      { "UI wireframe" = "reference/ui-wireframe.md" },
      { "Glossary" = "reference/glossary.md" },
  ]},
  { "Explanation" = [
      { "Architecture" = "explanation/architecture.md" },
      { "Discovery flow" = "explanation/discovery-flow.md" },
      { "Entry correctness" = "explanation/entry-correctness.md" },
      { "Engine port" = "explanation/engine-port.md" },
      { "UI conventions" = "explanation/ui-conventions.md" },
      { "Design records" = "explanation/design-records/index.md" },
  ]},
  { "Troubleshooting" = "troubleshooting.md" },
  { "Release notes" = "release-notes.md" },
  { "Documentation style guide" = "style-guide.md" },
]

extra_css = ["assets/extra.css"]

[project.theme]
language = "en"
features = [
  "announce.dismiss",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "search.suggest",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

# Mermaid is Zensical-native: the runtime is initialised automatically when a
# page contains a ```mermaid block. These fences match the retired inline SVGs.
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
