[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dataverse-curation-app"
version = "0.1.0"
description = "Desktop app to curate datasets submitted for review in Dataverse"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "requests>=2.31",
    "numpy>=1.24",
    "openpyxl>=3.1",
    "pyreadstat>=1.2",
    "h5py>=3.10",
    "netCDF4>=1.6",
    "lxml>=4.9",
    "Pillow>=10.0",
    "tifffile>=2023.9",
    "pypdf>=4.0",
    "chardet>=5.2",
    "hush-scan>=0.1.0,<0.2",
    "piigex>=0.2.0,<0.3",
]

# PEP 735 dependency group: `uv sync --group dev` (or pip >=25.1
# `pip install --group dev`). Replaces the former
# [project.optional-dependencies].dev extra (and the requirements.txt
# duplicate, deleted when uv was adopted); mypy was missing from
# requirements.txt.
[dependency-groups]
dev = [
    "pytest>=7.4",
    "pytest-cov>=5.0",
    "pytest-qt>=4.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pyinstaller>=6.0",
]

[tool.setuptools.packages.find]
include = ["engine*", "ui*"]

[tool.pytest.ini_options]
testpaths = ["engine/tests", "ui/tests"]
addopts = "-q"
qt_api = "pyside6"
filterwarnings = [
    "ignore::RuntimeWarning",
]

[tool.coverage.run]
source = ["engine", "ui", "storage", "config", "applog", "download_manager", "dataverse_client", "metadata_check", "review_rules"]
branch = true

[tool.coverage.report]
fail_under = 60
show_missing = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "UP", "D"]
# D203/D213 are the incompatible halves of the D211/D212 pairs ruff selects;
# naming them keeps the style the codebase already uses and silences the
# "incompatible rules" warning ruff prints on every run.
ignore = [
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D107",
    "D203",
    "D213",
    "E501",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["\\.venv/", "build/", "dist/"]