[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dataverse-curation-app"
version = "0.1.0"
description = "Desktop app to curate datasets submitted for review in Dataverse"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "requests>=2.31",
    "numpy>=1.24",
    "openpyxl>=3.1",
    "pyreadstat>=1.2",
    "h5py>=3.10",
    "netCDF4>=1.6",
    "lxml>=4.9",
    "Pillow>=10.0",
    "tifffile>=2023.9",
    "pypdf>=4.0",
    "chardet>=5.2",
    "hush-scan>=0.1.0,<0.2",
    "piigex>=0.2.0,<0.3",
]

# PEP 735 dependency group: `uv sync --group dev` (or pip >=25.1
# `pip install --group dev`). Replaces the former
# [project.optional-dependencies].dev extra (and the requirements.txt
# duplicate, deleted when uv was adopted); mypy was missing from
# requirements.txt.
[dependency-groups]
dev = [
    "pytest>=7.4",
    "pytest-cov>=5.0",
    "pytest-qt>=4.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pyinstaller>=6.0",
    "poethepoet>=0.48.0",
    "pre-commit>=4.0",
]

[tool.setuptools.packages.find]
include = ["engine*", "ui*"]

[tool.pytest.ini_options]
testpaths = ["engine/tests", "ui/tests"]
addopts = "-q"
qt_api = "pyside6"
filterwarnings = [
    "ignore::RuntimeWarning",
]

[tool.coverage.run]
source = ["engine", "ui", "storage", "config", "applog", "download_manager", "dataverse_client", "metadata_check", "review_rules"]
branch = true

[tool.coverage.report]
fail_under = 60
show_missing = true

[tool.poe.executor]
# `cmd` tasks run through CreateProcess without a shell on Windows and
# /bin/sh on Linux/macOS, so tasks stay identical across cmd/PowerShell/
# bash. Avoid `shell`-type tasks (POSIX-only quoting).
type = "simple"

[tool.poe.tasks]

  [tool.poe.tasks.setup]
  help = "Create/update the dev environment (uv, incl. dev group)"
  cmd = "uv sync --group dev"

  [tool.poe.tasks.run]
  help = "Launch the desktop GUI"
  cmd = "python main.py"

  [tool.poe.tasks.test]
  help = "Run the test suite"
  cmd = "pytest -q"

  [tool.poe.tasks.cover]
  help = "Run tests with engine coverage"
  cmd = "pytest -q --cov=engine --cov-report=term-missing"

  [tool.poe.tasks.lint]
  help = "Lint with ruff"
  cmd = "ruff check ."

  [tool.poe.tasks.typecheck]
  help = "Type-check engine/ with mypy"
  cmd = "mypy engine/"

  [tool.poe.tasks.gallery]
  help = "Open the component gallery (py main.py --gallery)"
  cmd = "python main.py --gallery"

  [tool.poe.tasks.probes]
  help = "UI probes (offscreen Qt safe)"
  cmd = "python tools/probes/run_all.py"

  [tool.poe.tasks.check]
  help = "Lint + typecheck + tests"
  sequence = ["lint", "typecheck", "test"]

  [tool.poe.tasks.clean]
  help = "Remove build/, dist/, .pyi-cache/ and stray .spec files"
  cmd = "python tools/clean_tree.py"

  # PyInstaller lite build: common formats bundled (JPG/PNG/GIF/BMP/WEBP,
  # PDF/XML/XLSX/TIFF, PIL, pypdf, tifffile, chardet), heavy binary libs
  # excluded. No --clean so the Analysis cache is reused (fast rebuilds).
  [tool.poe.tasks.build-lite]
  help = "Build dist/curation-app-lite (lite onedir; incremental)"
  cmd = 'python -m PyInstaller --noconfirm --name curation-app-lite --windowed --onedir --exclude-module pyreadstat --exclude-module netCDF4 --exclude-module h5py --exclude-module scipy --exclude-module tkinter --exclude-module turtle --exclude-module PIL.ImageTk --exclude-module PIL.SpiderImagePlugin --exclude-module PIL._avif --hidden-import hush --hidden-import hush.scanner --hidden-import hush.rules --hidden-import hush.entropy --collect-all piigex --hidden-import stdnum --add-data "ui/assets;ui/assets" --icon ui/assets/docent-mark.ico --workpath .pyi-cache main.py'

  # PyInstaller full build: heavy libs (pyreadstat/netCDF4/h5py/scipy) stay
  # in the same folder; run its exe directly for SPSS/SAS/Stata/NetCDF/HDF5.
  [tool.poe.tasks.build-full]
  help = "Build dist/curation-app-full (full onedir)"
  cmd = 'python -m PyInstaller --noconfirm --clean --name curation-app-full --windowed --onedir --hidden-import hush --hidden-import hush.scanner --hidden-import hush.rules --hidden-import hush.entropy --collect-all piigex --hidden-import stdnum --add-data "ui/assets;ui/assets" --icon ui/assets/docent-mark.ico --workpath .pyi-cache main.py'

  [tool.poe.tasks.copy-example-config]
  help = "Copy config.example.json into dist/curation-app-full/ (no-op if absent)"
  cmd = "python tools/copy_example_config.py"

  [tool.poe.tasks.build]
  help = "Build both artefacts (lite + full + example config copy)"
  sequence = ["build-lite", "build-full", "copy-example-config"]

  [tool.poe.tasks.smoke]
  help = "Headless smoke: lite exe exists, --headless --help works, frozen run reports no 'inspection failed'"
  cmd = "python tools/smoke_lite.py"

  # NOTE on exe icons: ui/assets/16x16.png is the source for every shipped
  # exe icon (docent-mark.ico); the 64x64 docent.png is About-art only.

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "UP", "D"]
# D203/D213 are the incompatible halves of the D211/D212 pairs ruff selects;
# naming them keeps the style the codebase already uses and silences the
# "incompatible rules" warning ruff prints on every run.
ignore = [
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D107",
    "D203",
    "D213",
    "E501",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["\\.venv/", "build/", "dist/"]