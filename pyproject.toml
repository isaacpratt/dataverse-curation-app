[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dataverse-docent"
dynamic = ["version"]
description = "Dataverse Docent - desktop app to curate datasets submitted for review in Dataverse"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "Isaac Pratt", email = "pratti@mcmaster.ca" },
]
keywords = ["dataverse", "curation", "research data", "desktop"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "PySide6>=6.12",
    "requests>=2.31",
    "numpy>=2",
    "openpyxl>=3.1",
    "pyreadstat>=1.2",
    "h5py>=3.10",
    "netCDF4>=1.6",
    "lxml>=4.9",
    "Pillow>=10.0",
    "tifffile>=2023.9",
    "pypdf>=4.0",
    "chardet>=5.2",
    "hush-scan>=0.1.0,<0.2",
    "keyring>=25.7.0",
    "piigex>=0.2.0,<0.3",
    "velopack==1.2.161",
]

[project.urls]
Repository = "https://github.com/isaacpratt/dataverse-curation-app"
Issues = "https://github.com/isaacpratt/dataverse-curation-app/issues"
Documentation = "https://isaacpratt.github.io/dataverse-curation-app/"

# Application, not library: never build/install it as a package. The wheel
# produced by the deleted setuptools config excluded the root modules, so
# `pip install .` yielded a broken app. uv/PyInstaller consume the tree
# in place; package = false stops uv building it on every sync.
[tool.uv]
package = false

# PEP 735 dependency group: `uv sync --group dev` (or pip >=25.1
# `pip install --group dev`). Replaces the former
# [project.optional-dependencies].dev extra (and the requirements.txt
# duplicate, deleted when uv was adopted); mypy was missing from
# requirements.txt.
[dependency-groups]
dev = [
    "actionlint-py>=1.7",
    "pytest>=7.4",
    "pytest-cov>=5.0",
    "pytest-qt>=4.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pyinstaller>=6.0",
    "poethepoet>=0.48.0",
    "pre-commit>=4.0",
    "pytest-xdist>=3.6",
    "import-linter>=2.3",
    "zensical>=0.0.53",
    # Markdown linter for the docs-as-code gate (pymarkdown CLI, no Node needed).
    "pymarkdownlnt>=0.9.26",
]

[tool.setuptools.packages.find]
include = ["engine*", "ui*", "curation*"]

# One version literal in the repo: engine/__init__.py:__version__. The
# package metadata reads it instead of keeping a second copy that a bump
# can miss (the release workflow refuses a tag that disagrees with it).
[tool.setuptools.dynamic]
version = { attr = "engine.__version__" }

[tool.pytest.ini_options]
testpaths = ["engine/tests", "curation/tests", "tools/tests", "ui/tests"]
# Serial by default: a local run is easier to read and to debug. CI passes
# `-n auto` (pytest-xdist) for the wall-clock win; the suite is
# order-independent, verified by repeated parallel runs (dv-hcg.41).
addopts = "-q --strict-markers -m 'not samples'"
# The default run must mean the same thing on every machine. Parity tests that
# read the CUR_Res_CurationTools sample data (a sibling clone, never vendored)
# carry the `samples` marker and are deselected here; `uv run poe samples`
# selects them explicitly. Without this, `pytest` runs a different suite - and
# reports a different coverage number - depending on what is checked out next
# to the repository.
markers = [
    "samples: parity tests that read the external CUR_Res_CurationTools sample data (opt in: uv run poe samples)",
]
qt_api = "pyside6"
# A Qt warning is a defect until someone classifies it (dv-bjj). pytest-qt
# turns every Qt message into a log record; WARNING fails the test that
# emitted it. The two ignored patterns are the environment talking, not the
# app: the offscreen plugin cannot honour a fixed-size request, and a machine
# without fontconfig has no font directory (the conftest points Qt at the
# platform's fonts first, so this one is the Linux-CI safety net). Anything
# else - a stylesheet Qt could not parse, a paint assertion - fails.
qt_log_level_fail = "WARNING"
qt_log_ignore = [
    "^QFontDatabase: Cannot find font directory",
    "^This plugin does not support propagateSizeHints\\(\\)",
]
xfail_strict = true
# RuntimeWarning is no longer silenced repo-wide: numerical oddities in a
# file-format checker should be visible. Narrow exceptions belong to the
# specific test that needs them, added on sight with a reason.
filterwarnings = [
]

[tool.coverage.run]
source = ["engine", "ui", "curation"]
branch = true
# Measure production code only. Test modules used to sit inside the measured
# packages and, being executed, counted as covered source: the engine reported
# 83% of 6097 statements when 3250 of those statements were the tests. Both
# test packages still live inside `source` (`curation/tests`, `ui/tests`), so
# this omit rule is load-bearing, not tidiness.
omit = ["*/tests/*"]

[tool.coverage.report]
# The floor is the honest clean-clone measurement, not a target: engine
# production statements, 65.7% of 2301 on a runner without the sample data and
# 75% where it is present (the `samples` tests are deselected either way, so
# the difference is only which machine's data they would have read). Raise it
# with real tests for uncovered production paths - dv-hcg.7 tracks the list -
# never by widening what the measure counts.
fail_under = 65
show_missing = true

[tool.poe.executor]
# `cmd` tasks run through CreateProcess without a shell on Windows and
# /bin/sh on Linux/macOS, so tasks stay identical across cmd/PowerShell/
# bash. Avoid `shell`-type tasks (POSIX-only quoting).
type = "simple"

[tool.poe.tasks]

  [tool.poe.tasks.setup]
  help = "Create/update the dev environment (uv, incl. dev group)"
  cmd = "uv sync --group dev"

  [tool.poe.tasks.run]
  help = "Launch the desktop GUI"
  cmd = "python main.py"

  [tool.poe.tasks.test]
  help = "Run the test suite"
  cmd = "pytest -q"

  [tool.poe.tasks.cover]
  help = "Run tests with engine coverage (floor from [tool.coverage.report])"
  cmd = "pytest -q --cov=engine --cov-report=term-missing"

  # Parity tests against the R tooling's sample data. They are deselected by
  # default (the `samples` marker) because that data is a sibling clone, not
  # part of this repository; run this on purpose when you have it.
  [tool.poe.tasks.samples]
  help = "Run the sample-data parity tests (skipped when the sibling clone is absent)"
  cmd = "pytest -q -m samples"

  [tool.poe.tasks.lint]
  help = "Lint with ruff"
  cmd = "ruff check ."

  [tool.poe.tasks.format-check]
  help = "Verify ruff formatting of the whole tree"
  cmd = "ruff format --check ."

  [tool.poe.tasks.fmt]
  help = "Apply ruff formatting to the whole tree (format-check verifies)"
  cmd = "ruff format ."

  [tool.poe.tasks.audit]
  help = "Vulnerability scan of the locked dependency set (uv.lock via pip-audit/OSV)"
  cmd = "python tools/audit/audit_deps.py"

  [tool.poe.tasks.hooks]
  help = "Run pre-commit hooks against all files"
  cmd = "pre-commit run --all-files"

  [tool.poe.tasks.license-report]
  help = "Write dist/licenses.md - license inventory of the locked environment"
  cmd = "python tools/audit/make_licenses.py"

  [tool.poe.tasks.sbom]
  help = "Write dist/sbom.cdx.json + dist/sbom.spdx.json - CycloneDX and SPDX SBOMs of the project venv"
  cmd = "python tools/audit/make_sbom.py"

  [tool.poe.tasks.notice]
  help = "Write dist/NOTICE - attribution file for the release artefacts"
  cmd = "python tools/audit/make_notice.py"

  [tool.poe.tasks.release-artefacts]
  help = "Generate every release artefact: licenses.md, NOTICE, both SBOMs"
  sequence = ["license-report", "notice", "sbom"]

  [tool.poe.tasks.docs-links]
  help = "Offline internal link check for the Markdown docs tree (no network)"
  cmd = "python tools/docs/check_doc_links.py"

  [tool.poe.tasks.docs-lint]
  help = "Lint the Markdown docs with pymarkdown (codespell runs in pre-commit)"
  cmd = "pymarkdown --strict-config --config .pymarkdown.json scan -r docs CONTRIBUTING.md README.md"

  [tool.poe.tasks.docs]
  help = "Build the Zensical documentation site into site/ (strict: broken links fail)"
  cmd = "zensical build --strict"

  [tool.poe.tasks.docs-gen-checks]
  help = "Regenerate the Check ID index in docs/reference/checks.md from the registry"
  cmd = "python tools/docs/gen_checks_reference.py --write"

  [tool.poe.tasks.docs-gen-checks-check]
  help = "Fail when the generated Check ID index is stale"
  cmd = "python tools/docs/gen_checks_reference.py --check"

  [tool.poe.tasks.docs-gen-cli]
  help = "Regenerate the CLI reference in docs/reference/cli.md from argparse"
  cmd = "python tools/docs/gen_cli_reference.py --write"

  [tool.poe.tasks.docs-gen-cli-check]
  help = "Fail when the generated CLI reference is stale"
  cmd = "python tools/docs/gen_cli_reference.py --check"

  [tool.poe.tasks.docs-check]
  help = "Full docs gate: markdown lint + offline links + generated sections + strict build"
  sequence = ["docs-lint", "docs-links", "docs-gen-checks-check", "docs-gen-cli-check", "docs"]

  [tool.poe.tasks.docs-serve]
  help = "Preview the Zensical docs with live reload"
  cmd = "zensical serve"

  [tool.poe.tasks.complexity]
  help = "Advisory cyclomatic-complexity report (radon) -> reports/complexity.md"
  cmd = "python tools/audit/complexity_report.py"

  [tool.poe.tasks.contracts]
  help = "Import-linter contracts: the engine and the curation core must not import ui/Qt; the tools must not import ui"
  cmd = "lint-imports"

  [tool.poe.tasks.typecheck]
  help = "Type-check the engine contract and the curation core (mypy; scope from [tool.mypy] files/exclude)"
  cmd = "mypy"

  [tool.poe.tasks.gallery]
  help = "Open the component gallery (py main.py --gallery)"
  cmd = "python main.py --gallery"

  [tool.poe.tasks.probes]
  help = "UI probes (offscreen Qt safe)"
  cmd = "python tools/probes/run_all.py"

  [tool.poe.tasks.check]
  help = "Lint + format-check + typecheck + contracts + tests"
  sequence = ["lint", "format-check", "typecheck", "contracts", "test"]

  [tool.poe.tasks.clean]
  help = "Remove build/, dist/, .pyi-cache/ and stray .spec files"
  cmd = "python tools/build/clean_tree.py"

  # PyInstaller flags live in tools/build/build_app.py (one list, one artefact:
  # dist/DataverseDocent, with config.example.json copied in). That script
  # prints wall time + artefact size.
  [tool.poe.tasks.build]
  help = "Build dist/DataverseDocent (the app folder `poe pack` packages)"
  cmd = "python tools/build/build_app.py"

  [tool.poe.tasks.smoke]
  help = "Headless smoke: the app exe exists, --headless --help works, frozen run reports no 'inspection failed'"
  cmd = "python tools/build/smoke_app.py"

  # Velopack packaging: turns dist/DataverseDocent into dist/releases
  # (Setup.exe, portable zip, nupkg, feed) and verifies the result with
  # tools/build/check_pack.py. Build-time only: needs the .NET 10 SDK plus
  # `dotnet tool install -g vpk` on the machine. Never publishes.
  [tool.poe.tasks.pack]
  help = "Pack dist/DataverseDocent into a Velopack release (dist/releases)"
  cmd = "python tools/build/pack_app.py"

  [tool.poe.tasks.check-pack]
  help = "Verify an existing dist/releases without rebuilding it"
  cmd = "python tools/build/check_pack.py"

  # NOTE on exe icons: ui/assets/16x16.png is the source for every shipped
  # exe icon (docent-mark.ico); the 64x64 docent.png is About-art only.

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# High-signal families beyond the original seven: N (pep8-naming; Qt override
# methods carry targeted noqa comments), RUF (mutable defaults, useless
# suppressions), SIM (needless nesting/redundant branches), PT (pytest style),
# C90 (mccabe; budget below), TID (import hygiene). Findings are either fixed
# or grandfathered per file with a dated burn-down note - never blanket-ignored.
select = ["E", "F", "I", "B", "C4", "UP", "D", "N", "RUF", "SIM", "PT", "C90", "TID"]
# D203/D213 are the incompatible halves of the D211/D212 pairs ruff selects;
# naming them keeps the style the codebase already uses and silences the
# "incompatible rules" warning ruff prints on every run.
# E501 stays ignored on purpose: line length is enforced by ruff format
# (100 cols) at the formatter; E501 would double-report wrapped lines.
ignore = [
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D107",
    "D203",
    "D213",
    "E501",
    # SIM105: the codebase deliberately uses try/except/pass with surrounding
    # context (best-effort cleanup paths); contextlib.suppress adds nothing
    # semantic at 165 call sites and is not a clarity win.
    "SIM105",
    # R = ruff builtin rule for ambiguous unicode: human prose (check
    # messages, docs, comments) uses typographic dashes/arrows by design
    # (en-CA copy); not a spoofing vector in this codebase.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Qt naming contracts, not Python style: mixedCase is the framework's API
# (paintEvent/sizeHint/mousePressEvent...). Scoped to ui/ only.
"ui/**" = ["N802", "N815"]
# win32 ctypes constants keep MSDN names for cross-reference (SWP_*, HT*...).
"ui/main_window.py" = ["N806"]
# Fake Qt header stubs in engine tests mirror the real camelCase API.
# Test functions document themselves via their names; no docstrings required.
"engine/tests/**" = ["N802", "D103"]
"curation/tests/**" = ["N802", "D103"]
"tools/tests/**" = ["D103"]
"ui/tests/**" = ["D103"]
"tools/probes/**" = ["D103"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.mypy]
python_version = "3.11"
# The engine contract is checked under mypy --strict. The scope is the
# `files` list below: the engine plus the curation core it is built on
# (client, storage, downloads, metadata rules, request log).
#
# Burn-down note (2026-11-16, dv-hcg.27): the last 44 errors under the
# strict subset were fixed by annotating the engine, the client and the
# core services - no per-module ignore list was needed and none is
# configured here. The UI typing ramp (dv-hcg.28) then joined `files`
# under the documented relaxation below.
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
# Gate the engine contract, the curation core it is built on and the UI
# layer: the engine plus the curation core (client, storage, downloads,
# metadata rules, request log), the test suites that sit with those
# packages, the tool-script tests, the UI package (source and tests) and
# the entry point.
#
# The engine and curation tests are Qt-free (dv-hcg.26 moved the borrowed
# dashboard cache helpers into curation.dashboard_cache), so they join
# the gate under the documented test relaxation instead of an exclusion.
# The UI layer joined the gate in dv-hcg.28, under the documented
# relaxation of --strict below; `main.py` is checked under the full
# strict settings (it is the entry point, not a UI module).
files = [
    "engine",
    "curation",
    "tools/tests",
    "ui",
    "main.py",
]
exclude = [
    "^\\.venv/",
    "^build/",
    "^dist/",
]

# Test policy (ratified 2026-11-20, dv-a4w / ADR 0008): every application
# module — ui.* included — is now checked under full --strict. Only the
# test modules relax, and only the three "you must annotate" rules below;
# every shape check and `check_untyped_defs` stay ON for them as well.
[[tool.mypy.overrides]]
module = ["curation.tests.*", "engine.tests.*", "tools.tests.*", "ui.tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false
check_untyped_defs = true

# Machine-enforced dependency direction (import-linter).
#
#   engine  <-  curation (config/storage/client/...)  <-  ui
#
# The engine is the part that must stay usable headless and testable
# without Qt: if engine/ ever imports ui/ or PySide6, the engine gate and
# the headless build break. The curation core is the app's middle layer -
# it may not reach back into the views either. The tools/ scripts are
# operational helpers that run outside the app, so they may not drag the
# UI layer in either.
[tool.importlinter]
# The repo has no importable top-level package (the app is flat and
# `package = false`), so the contracts are expressed against the project
# directories that are packages in their own right.
root_packages = ["engine", "ui", "curation", "tools"]
# PySide6 must be in the graph: the Qt half of the engine contract is only
# visible when external packages are included.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Engine must not import the UI layer or Qt"
type = "forbidden"
source_modules = ["engine"]
forbidden_modules = ["ui", "PySide6"]
# No exceptions: the engine tests are Qt-free since dv-hcg.26. The dashboard
# cache helpers they used to borrow from ui/dashboard.py now live in the
# Qt-free curation.dashboard_cache module, and the size-formatter test
# moved to ui/tests/ (it asserts something about the views).

[[tool.importlinter.contracts]]
name = "Curation core must not import the UI layer or Qt"
type = "forbidden"
source_modules = ["curation"]
forbidden_modules = ["ui", "PySide6"]
# The curation core (config, storage, client, metadata rules, response
# drafting) knows nothing about the views: ui/ imports it, never the other
# way round. The contract landed with the curation/ consolidation
# (dv-hcg.24) - the layering existed, the filesystem did not say so.
# Qt moved out with it: the table-layout sort direction is persisted as a
# plain int and the view layer converts it to Qt.SortOrder.

[[tool.importlinter.contracts]]
name = "Tools must not import the UI layer"
type = "forbidden"
source_modules = ["tools"]
forbidden_modules = ["ui"]
# The probes ARE the UI's test harness: they drive the views offscreen and
# assert on pixels and geometry. The paint benchmark is the same kind of
# tool: it drives the real dashboard to measure the queue's painting
# window. Every other tool (audit, sbom, licenses, notice, smoke, doc
# links, complexity) is an operational helper that runs outside the app
# and must stay importable without Qt.
ignore_imports = [
    "tools.perf.bench_paint_window -> ui.dashboard",
    "tools.perf.bench_paint_window -> ui.theme",
    "tools.probes._common -> ui.theme",
    "tools.probes.probe_about_updates -> ui.about_pane",
    "tools.probes.probe_about_updates -> ui.updater",
    "tools.probes.probe_auto_checks_affordances -> ui.dataset",
    "tools.probes.probe_card_corner -> ui.main_window",
    "tools.probes.probe_disposition_rows -> ui.dataset",
    "tools.probes.probe_disposition_rows -> ui.i18n",
    "tools.probes.probe_disposition_rows -> ui.widgets",
    "tools.probes.probe_extensions_rows -> ui.settings_dialog",
    "tools.probes.probe_gallery_inputs -> ui.gallery",
    "tools.probes.probe_gallery_inputs -> ui.widgets",
    "tools.probes.probe_headings -> ui.main_window",
    "tools.probes.probe_icon_sheet -> ui.gallery",
    "tools.probes.probe_icon_sheet -> ui.icons",
    "tools.probes.probe_icon_sheet -> ui.widgets",
    "tools.probes.probe_manifest_columns -> ui.dataset",
    "tools.probes.probe_metadata_rows -> ui.dataset",
    "tools.probes.probe_preview -> ui.preview",
    "tools.probes.probe_qt_warnings -> ui.theme",
    "tools.probes.probe_qt_warnings -> ui.widgets",
    "tools.probes.probe_queue_columns -> ui.main_window",
    "tools.probes.probe_rail_nav -> ui.dataset",
    "tools.probes.probe_review_table -> ui.review_config",
    "tools.probes.probe_review_selection -> ui.review_config",
    "tools.probes.probe_review_selection -> ui.theme",
    "tools.probes.probe_review_selection -> ui.widgets",
    "tools.probes.probe_review_cards -> ui.review_config",
    "tools.probes.probe_review_params -> ui.review_config",
    "tools.probes.probe_review_params -> ui.widgets",
    "tools.probes.probe_check_sections -> ui.dataset",
    "tools.probes.probe_dataset_header -> ui.dataset",
]
