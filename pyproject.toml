[project]
name = "dataverse-curation-app"
version = "0.1.0"
description = "Desktop app to curate datasets submitted for review in Dataverse"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "Isaac Pratt", email = "pratti@mcmaster.ca" },
]
keywords = ["dataverse", "curation", "research data", "desktop"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "PySide6>=6.6",
    "requests>=2.31",
    "numpy>=1.24",
    "openpyxl>=3.1",
    "pyreadstat>=1.2",
    "h5py>=3.10",
    "netCDF4>=1.6",
    "lxml>=4.9",
    "Pillow>=10.0",
    "tifffile>=2023.9",
    "pypdf>=4.0",
    "chardet>=5.2",
    "hush-scan>=0.1.0,<0.2",
    "piigex>=0.2.0,<0.3",
]

[project.urls]
Repository = "https://github.com/isaacpratt/dataverse-curation-app"
Issues = "https://github.com/isaacpratt/dataverse-curation-app/issues"
Documentation = "https://github.com/isaacpratt/dataverse-curation-app/tree/master/docs/html"

# Application, not library: never build/install it as a package. The wheel
# produced by the deleted setuptools config excluded the ten root modules,
# so `pip install .` yielded a broken app. uv/PyInstaller consume the tree
# in place; package = false stops uv building it on every sync.
[tool.uv]
package = false

# PEP 735 dependency group: `uv sync --group dev` (or pip >=25.1
# `pip install --group dev`). Replaces the former
# [project.optional-dependencies].dev extra (and the requirements.txt
# duplicate, deleted when uv was adopted); mypy was missing from
# requirements.txt.
[dependency-groups]
dev = [
    "actionlint-py>=1.7",
    "pytest>=7.4",
    "pytest-cov>=5.0",
    "pytest-qt>=4.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pyinstaller>=6.0",
    "poethepoet>=0.48.0",
    "pre-commit>=4.0",
]

[tool.pytest.ini_options]
testpaths = ["engine/tests", "ui/tests"]
addopts = "-q"
qt_api = "pyside6"
filterwarnings = [
    "ignore::RuntimeWarning",
]

[tool.coverage.run]
source = ["engine", "ui", "storage", "config", "applog", "download_manager", "dataverse_client", "metadata_check", "review_rules"]
branch = true

[tool.coverage.report]
fail_under = 60
show_missing = true

[tool.poe.executor]
# `cmd` tasks run through CreateProcess without a shell on Windows and
# /bin/sh on Linux/macOS, so tasks stay identical across cmd/PowerShell/
# bash. Avoid `shell`-type tasks (POSIX-only quoting).
type = "simple"

[tool.poe.tasks]

  [tool.poe.tasks.setup]
  help = "Create/update the dev environment (uv, incl. dev group)"
  cmd = "uv sync --group dev"

  [tool.poe.tasks.run]
  help = "Launch the desktop GUI"
  cmd = "python main.py"

  [tool.poe.tasks.test]
  help = "Run the test suite"
  cmd = "pytest -q"

  [tool.poe.tasks.cover]
  help = "Run tests with engine coverage"
  cmd = "pytest -q --cov=engine --cov-report=term-missing"

  [tool.poe.tasks.lint]
  help = "Lint with ruff"
  cmd = "ruff check ."

  # Phase-1 scope (dv-hcg.2/.3): engine + root modules + tools. Flip to
  # ["."] when the ui/ format phase lands.
  [tool.poe.tasks.format-check]
  help = "Verify ruff formatting of the phase-1 file set (engine, root modules, tools)"
  cmd = "ruff format --check engine main.py applog.py config.py dataverse_client.py download_manager.py metadata_check.py response_draft.py review_rules.py startup_probe.py storage.py tools/"

  [tool.poe.tasks.fmt]
  help = "Apply ruff formatting (phase-1 set; use --check via format-check)"
  cmd = "ruff format engine main.py applog.py config.py dataverse_client.py download_manager.py metadata_check.py response_draft.py review_rules.py startup_probe.py storage.py tools/"

  [tool.poe.tasks.audit]
  help = "Vulnerability scan of the locked dependency set (uv.lock via pip-audit/OSV)"
  cmd = "python tools/audit_deps.py"

  [tool.poe.tasks.hooks]
  help = "Run pre-commit hooks against all files"
  cmd = "pre-commit run --all-files"

  [tool.poe.tasks.license-report]
  help = "Write dist/licenses.md - license inventory of the locked environment"
  cmd = "python tools/make_licenses.py"

  [tool.poe.tasks.sbom]
  help = "Write dist/sbom.cdx.json - CycloneDX SBOM of the project venv"
  cmd = "python tools/make_sbom.py"

  [tool.poe.tasks.docs-links]
  help = "Offline link/anchor check for docs/html/*.html"
  cmd = "python tools/check_doc_links.py"

  [tool.poe.tasks.typecheck]
  help = "Type-check the engine (mypy; scope from [tool.mypy] files/exclude)"
  cmd = "mypy"

  [tool.poe.tasks.gallery]
  help = "Open the component gallery (py main.py --gallery)"
  cmd = "python main.py --gallery"

  [tool.poe.tasks.probes]
  help = "UI probes (offscreen Qt safe)"
  cmd = "python tools/probes/run_all.py"

  [tool.poe.tasks.check]
  help = "Lint + typecheck + tests"
  sequence = ["lint", "typecheck", "test"]

  [tool.poe.tasks.clean]
  help = "Remove build/, dist/, .pyi-cache/ and stray .spec files"
  cmd = "python tools/clean_tree.py"

  # PyInstaller lite build: common formats bundled (JPG/PNG/GIF/BMP/WEBP,
  # PDF/XML/XLSX/TIFF, PIL, pypdf, tifffile, chardet), heavy binary libs
  # excluded. No --clean so the Analysis cache is reused (fast rebuilds).
  [tool.poe.tasks.build-lite]
  help = "Build dist/curation-app-lite (lite onedir; incremental)"
  cmd = 'python -m PyInstaller --noconfirm --name curation-app-lite --windowed --onedir --exclude-module pyreadstat --exclude-module netCDF4 --exclude-module h5py --exclude-module scipy --exclude-module tkinter --exclude-module turtle --exclude-module PIL.ImageTk --exclude-module PIL.SpiderImagePlugin --exclude-module PIL._avif --hidden-import hush --hidden-import hush.scanner --hidden-import hush.rules --hidden-import hush.entropy --collect-all piigex --hidden-import stdnum --add-data "ui/assets;ui/assets" --icon ui/assets/docent-mark.ico --workpath .pyi-cache main.py'

  # PyInstaller full build: heavy libs (pyreadstat/netCDF4/h5py/scipy) stay
  # in the same folder; run its exe directly for SPSS/SAS/Stata/NetCDF/HDF5.
  [tool.poe.tasks.build-full]
  help = "Build dist/curation-app-full (full onedir)"
  cmd = 'python -m PyInstaller --noconfirm --clean --name curation-app-full --windowed --onedir --hidden-import hush --hidden-import hush.scanner --hidden-import hush.rules --hidden-import hush.entropy --collect-all piigex --hidden-import stdnum --add-data "ui/assets;ui/assets" --icon ui/assets/docent-mark.ico --workpath .pyi-cache main.py'

  [tool.poe.tasks.copy-example-config]
  help = "Copy config.example.json into dist/curation-app-full/ (no-op if absent)"
  cmd = "python tools/copy_example_config.py"

  [tool.poe.tasks.build]
  help = "Build both artefacts (lite + full + example config copy)"
  sequence = ["build-lite", "build-full", "copy-example-config"]

  [tool.poe.tasks.smoke]
  help = "Headless smoke: lite exe exists, --headless --help works, frozen run reports no 'inspection failed'"
  cmd = "python tools/smoke_lite.py"

  # NOTE on exe icons: ui/assets/16x16.png is the source for every shipped
  # exe icon (docent-mark.ico); the 64x64 docent.png is About-art only.

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "UP", "D"]
# D203/D213 are the incompatible halves of the D211/D212 pairs ruff selects;
# naming them keeps the style the codebase already uses and silences the
# "incompatible rules" warning ruff prints on every run.
ignore = [
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D107",
    "D203",
    "D213",
    "E501",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
# Gate the engine contract only. engine/tests import the PySide6 view layer
# (ui.dashboard, ui.checks_tree, ...), which would drag ~170 Qt-stub-only
# attr-defined errors into the gate (PySide6 exposes enums only under their
# scoped names, e.g. Qt.CursorShape.PointingHandCursor). UI typing is tracked
# separately; tests are exercised by pytest, not by mypy.
files = [
    "engine",
    "applog.py",
    "metadata_check.py",
    "review_rules.py",
    "dataverse_client.py",
    "download_manager.py",
    "storage.py",
]
exclude = [
    "^\\.venv/",
    "^build/",
    "^dist/",
    "^engine/tests/",
]