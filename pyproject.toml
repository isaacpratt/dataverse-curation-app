[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dataverse-curation-app"
version = "0.1.0"
description = "Desktop app to curate datasets submitted for review in Dataverse"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "requests>=2.31",
    "dataverse-metadata-crawler @ git+https://github.com/scholarsportal/dataverse-metadata-crawler.git",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "pyreadstat>=1.2",
    "h5py>=3.10",
    "netCDF4>=1.6",
    "lxml>=4.9",
    "Pillow>=10.0",
    "tifffile>=2023.9",
    "pypdf>=4.0",
    "chardet>=5.2",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["engine*", "ui*"]

[tool.pytest.ini_options]
testpaths = ["engine/tests"]