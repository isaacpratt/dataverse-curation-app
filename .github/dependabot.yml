# Dependency freshness: uv (Python), github-actions and pre-commit hooks.
# Weekly, minor/patch grouped so noise stays low; major bumps arrive as
# their own PRs so they get a real review. The audit gate in CI
# (tools/audit/audit_deps.py) catches vulnerabilities; this bot keeps the
# queue from rotting.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 6
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 6
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 6
