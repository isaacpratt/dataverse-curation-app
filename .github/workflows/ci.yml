name: CI

on:
  # Master pushes are tested directly.
  push:
    branches: [master]
  # Every pull request into master is tested, and the result is reported on
  # the PR itself. Scoping push to master means a feature branch gets one
  # run (through the PR) instead of two (push + pull_request).
  pull_request:
    branches: [master]
  workflow_dispatch:

# The workflow only reads the repository; it never needs write access.
permissions:
  contents: read

# A newer push to the same branch makes the running check obsolete.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      # checkout v5, setup-python v6 and setup-uv v10.3.3 are pinned to
      # commit SHAs (with the tag they moved to recorded) — tags are
      # mutable, SHAs are not. Note: the bare `v10` tag no longer exists
      # on astral-sh/setup-uv; v10.3.3 is the current v10 release.
      # checkout v5 and setup-python v6 run on Node 24; earlier pairs
      # targeted Node 20, which GitHub now forces onto a newer runtime
      # and reports as a deprecation warning on every run.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Lockfile check
        run: uv lock --check
      - name: Install
        run: uv sync --locked --group dev
      - name: Workflow lint (actionlint)
        run: uv run --group dev actionlint
      - name: Dependency vulnerability scan (uv.lock via OSV)
        run: uv run --group dev python tools/audit_deps.py
      - name: Commit hygiene (pre-commit)
        run: uv run --group dev pre-commit run --all-files
      - name: Lint
        run: uv run --group dev python -m ruff check .
      - name: Type check
        run: uv run --group dev mypy
      - name: Tests
        run: uv run --group dev python -m pytest -q --cov=engine --cov-report=term-missing --cov-fail-under=75
      - name: Compile check
        run: uv run --group dev python -m compileall -q engine dataverse_client.py download_manager.py storage.py config.py main.py
      - name: Headless smoke
        run: uv run --group dev python main.py --headless --help

  probes:
    # The checks pytest cannot see: a pixel at a card's corner, a column
    # geometry after a drag. Each probe prints PASS/FAIL per check and
    # exits non-zero when one fails. The button-sheet and gallery
    # contracts moved into pytest (test_gallery_contract.py).
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      # Same pinned actions as the test job (Node 24).
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Lockfile check
        run: uv lock --check
      - name: Install
        run: uv sync --locked --group dev
      - name: UI probes
        run: uv run --group dev python tools/probes/run_all.py
