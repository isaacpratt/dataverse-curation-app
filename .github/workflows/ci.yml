name: CI

on:
  # Master pushes are tested directly.
  push:
    branches: [master]
  # Every pull request into master is tested, and the result is reported on
  # the PR itself. Scoping push to master means a feature branch gets one
  # run (through the PR) instead of two (push + pull_request).
  pull_request:
    branches: [master]
  workflow_dispatch:

# The workflow only reads the repository; it never needs write access.
permissions:
  contents: read

# A newer push to the same branch makes the running check obsolete.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      # checkout v5 and setup-python v6 run on Node 24; the v4/v5 pair
      # targeted Node 20, which GitHub now forces onto a newer runtime and
      # reports as a deprecation warning on every run.
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint
        run: python -m ruff check .
      - name: Tests
        run: python -m pytest -q --cov=engine --cov-report=term-missing
      - name: Compile check
        run: python -m compileall -q engine dataverse_client.py download_manager.py storage.py config.py main.py
      - name: Headless smoke
        run: python main.py --headless --help

  probes:
    # The checks pytest cannot see: a pixel at a card's corner, a column
    # geometry after a drag, the two button sheets agreeing, the gallery
    # showing every kit component. Each probe prints PASS/FAIL per check
    # and exits non-zero when one fails.
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      # Same action versions as the test job (Node 24).
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: UI probes
        run: python tools/probes/run_all.py
