name: Docs

# Build the Zensical site on every PR into master (so a broken doc fails the
# gate) and deploy it to GitHub Pages on pushes to master only. The deploy job
# is explicitly gated on the event/ref, so forks and PRs can never publish.
#
# Repo Settings -> Pages -> Source: GitHub Actions. The site URL carries the
# /dataverse-curation-app/ base path (zensical.toml), matching the Pages URL.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Lockfile check
        run: uv lock --check
      - name: Install (locked, dev group includes zensical)
        run: uv sync --frozen --group dev
      - name: Build docs (strict — warnings fail the build)
        run: uv run zensical build --strict
      - name: Check built pages exist
        run: |
          test -f site/index.html
          test -f site/architecture/index.html || test -f site/architecture.html
      - name: Upload Pages artifact (master pushes only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
