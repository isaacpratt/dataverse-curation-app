# https://pre-commit.com
# Trimmed set for this Windows-first PyInstaller repo — see dv-ceh.5.
# Check-only, matching CI; no auto-fixers except the whitespace/EOF fixers,
# whose first-pass commit has landed. Not enabled: commitizen, ruff format,
# ty (all deliberately deferred per the project's Substrate evaluation).
# The ruff-check hook uses the lockfile's ruff (via uv run), not a fresh
# virtualenv, and never mutates files (check-only, like CI's lint step).
default_install_hook_types: [pre-commit]
default_stages: [pre-commit, manual]
fail_fast: true
repos:
  - repo: meta
    hooks:
      - id: check-useless-excludes

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-illegal-windows-names
      - id: check-merge-conflict
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: debug-statements
      - id: detect-private-key
        # test_secrets_check.py embeds a truncated fake RSA key fixture
        # ("MIIEpAIBAAKCAQ...") for the secret-scanner's own tests.
        exclude: "^engine/tests/test_secrets_check\\.py$"
      - id: end-of-file-fixer
        types: [python]
      - id: trailing-whitespace
        types: [python]

  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: v1.10.0
    hooks:
      - id: text-unicode-replacement-char

  # codespell: en-GB_to_en-US builtin deliberately NOT enabled — this is a
  # Canadian project. Rare-word false positives are ignored in .codespellrc.
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        types_or: [markdown, python, pyi, toml, yaml]

  - repo: local
    hooks:
      - id: forbid-config-json
        name: forbid committing config.json (holds the API token)
        # language: fail can never succeed; fires when a staged/committed path matches
        entry: "config.json contains a Dataverse API token and must never be committed (copy config.example.json instead). Unstage it and rotate the token if it already landed anywhere."
        language: fail
        files: "^config\\.json$"
      - id: actionlint
        name: actionlint (GitHub workflows)
        entry: uv run --group dev actionlint
        language: system
        pass_filenames: false
        files: "^\\.github/workflows/.*\\.ya?ml$"
      - id: uv-lock-check
        name: uv lock --check
        entry: uv lock --check
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: ruff-check
        name: ruff check
        entry: uv run --group dev ruff check --force-exclude
        language: system
        types_or: [python, pyi]
        pass_filenames: true
      - id: ruff-format-check
        name: ruff format --check
        entry: uv run --group dev poe format-check
        language: system
        pass_filenames: false
      # Markdown lint for the docs-as-code gate. Uses the lockfile's pymarkdown
      # (no Node toolchain); codespell above covers prose spelling.
      - id: markdown-lint
        name: pymarkdown docs lint
        entry: uv run --group dev pymarkdown --strict-config --config .pymarkdown.json scan -r
        language: system
        types: [markdown]
        files: "^(docs/.*\\.md|CONTRIBUTING\\.md|README\\.md)$"
